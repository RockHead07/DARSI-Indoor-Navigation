name: Acquire Unity Activation File 🔑

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: get-activation-file
        uses: game-ci/unity-request-activation-file@v4

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: ${{ steps.get-activation-file.outputs.filePath }}
