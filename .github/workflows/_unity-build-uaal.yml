name: Reusable Unity Build UaaL

on:
  workflow_call:

jobs:
  build-uaal-android:
    name: Export Unity as a Library (Android)
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.FLUTTER_DISPATCH_TOKEN }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity Android UaaL Export
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          # buildMethod, BUKAN customParameters: unity-builder sudah mengirim
          # -executeMethod miliknya sendiri, jadi menambah satu lagi lewat
          # customParameters menghasilkan ArgumentException "duplicate key:
          # executeMethod" (lihat docs/CICD.md §7).
          buildMethod: UaaLBuildScript.BuildAndroidUaaL

      - name: Upload Unity Editor Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Editor-Log-Build
          path: ~/.config/unity3d/**/*.log
          retention-days: 7

      - name: Compress Exported UaaL Module
        run: |
          cd Builds/AndroidUaaL
          zip -r ../../unity-android-uaal-export.zip .

      - name: Upload UaaL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARSI-Unity-UaaL-Android
          path: unity-android-uaal-export.zip
          retention-days: 14

      - name: Trigger Flutter Host App Pipeline (MyRSIy)
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: RockHead07/MyRSIy
          event-type: unity-uaal-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
