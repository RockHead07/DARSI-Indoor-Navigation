name: Reusable Backend Tests

on:
  workflow_call:

jobs:
  test-backend:
    name: Test & Lint Python API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Backend/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi

      - name: Code Quality & Syntax Check (Ruff)
        run: |
          ruff check Backend/

      - name: Run PyTest
        run: |
          if [ -d Backend/tests ]; then pytest Backend/tests; else echo "No backend unit test directory found yet, skipping pytest."; fi
