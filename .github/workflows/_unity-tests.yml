name: Reusable Unity Tests

on:
  workflow_call:

jobs:
  unity-tests:
    name: Unity EditMode & PlayMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Standalone-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Standalone-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: All
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload Unity Editor Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Unity-Editor-Log-Tests
          path: ~/.config/unity3d/**/*.log
          retention-days: 7
